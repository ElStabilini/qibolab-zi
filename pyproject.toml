[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qibolab-zi"
version = "0.0.5"
description = "Quantum hardware module and drivers for Qibo"
authors = [{ name = "The Qibo team" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.14"
keywords = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "qibolab>=0.2.12,<0.3.0",
  "laboneq==26.10",
  "lark>=1.1.9,<2.0.0",
  "qcodes>=0.52.0,<0.53.0",
  "qcodes_contrib_drivers>=0.23.0,<0.24.0",
  "pyvisa-py>=0.8.0,<0.9.0",
]

[project.urls]
Repository = "https://github.com/ElStabilini/qibolab-zi.git"

[dependency-groups]
dev = [
  "pudb>=2024.1.3,<2025.0.0",
  "ipython>=8.12.0,<9.0.0",
]
docs = [
  "sphinx>=6.1.3,<7.0.0",
  "furo>=2023.3.27,<2024.0.0",
  "recommonmark>=0.7.1,<0.8.0",
  "sphinxcontrib-bibtex>=2.5.0,<3.0.0",
  "sphinx-markdown-tables>=0.0.17,<0.0.18",
  "nbsphinx>=0.9.1,<0.10.0",
  "ipython>=8.12.0,<9.0.0",
  "sphinx-copybutton>=0.5.1,<0.6.0",
]
tests = [
  "pytest>=7.2.2",
  "pytest-cov>=4.0.0,<5.0.0",
  "pytest-env>=0.8.1",
  "pytest-mock>=3.10.0",
]
analysis = [
  "ruff>=0.9.1,<0.10.0",
]

[tool.uv]
# Poetry groups were all `optional = true`; uv installs `dev` by default,
# so disable default groups to keep the same behaviour.
default-groups = []

[tool.hatch.build.targets.wheel]
packages = ["src/qibolab_zi"]

[tool.poe.tasks]
test = "pytest"
lint = "ruff check"
lint-warnings = """
  ruff check --exit-zero \
  --select F,E,W,C90,N,UP,BLE,FBT,B,A,C4,T10,EM,EXE,ISC,ICN,LOG,G,INP,PIE,T20,PT,Q,RSE,\
           RET,SLF,SLOT,SIM,TC,INT,ARG,PTH,ERA,NPY,PERF,RUF
"""
types = "true"
docs = "make -C docs html"
docs-clean = "make -C docs clean"
test-docs = "make -C docs doctest"

[tool.pytest.ini_options]
testpaths = ['tests/']
markers = ["qpu: mark tests that require qpu"]
addopts = [
  # '--cov=qibolab_zi', # must be changed to a coverage for zi
  '--cov-report=xml',
  '--cov-report=html',
  '-m not qpu',
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403"]

[tool.pycln]
all = true
exclude = "__init__.py"
